<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI BlogNest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI BlogNest</h1>

        <p>Generate blogs using Artificial Intelligence</p>

        <input
            type="text"
            id="topic"
            placeholder="Enter your blog topic"
        >

        <br><br>

        <button id="generateBtn">
            Generate Blog
        </button>

        <div id="result">
            Your generated blog will appear here.
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
